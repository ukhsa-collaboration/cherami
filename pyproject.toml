[project]
name = "cherami"
version = "26.8.0"
description = "Cherami - *SCAPE sample orchestration."
readme = "README.md"
authors = [
    { name = "Sam Sims", email = "sam.sims@ukhsa.gov.uk" },
    { name = "Jess Friedersdorff", email = "jess.friedersdorff@ukhsa.gov.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "climb-onyx-client>=4.8.2",
    "kubernetes>=33.1.0",
    "varys-client==1.2.0",
    "onyx-analysis-helper@git+https://github.com/ukhsa-collaboration/onyx-analysis-helper.git@v0.6.1",
    "rich-click>=1.9.8",
]


[project.scripts]
cherami = "cherami.main:cli"

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "B", "SIM", "I", "C4", "PTH", "G", "T20", "PT", "N", "ANN", "LOG", "UP", "FBT"]
ignore = ["ANN401", "E501",]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "ANN"]
"scripts/*" = ["ALL"]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.13.1",
]
