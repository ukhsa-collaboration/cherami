[project]
name = "cherami"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sam Sims", email = "samsimss98@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.8",
    "climb-onyx-client>=4.8.2",
    "kubernetes>=33.1.0",
    "pandas>=2.3.3",
    "varys-client>=1.1.0",
]

[project.scripts]
cherami = "cherami.main:cli"

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B", "SIM", "I", "C4", "PTH", "G", "T20", "PT", "N", "ANN", "LOG", "UP", "FBT"]
ignore = ["ANN401"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "ANN"]
"scripts/*" = ["ALL"]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "ruff>=0.13.1",
]
